# The jar only holds environment-independent defaults. All runtime configuration is external:
#   local dev   config/application.yml (committed, no passwords) + config/secrets.yml (gitignored)
#   production  deploy/config/application.yml + deploy/config/trader.env (gitignored)
# Startup argument: --spring.config.additional-location=file:./config/
spring:
  application:
    name: trading-signal
  # DataSource and Flyway auto-configuration are excluded by default: as soon as Hikari is on the classpath,
  # DataSourceAutoConfiguration fails with "Failed to determine a suitable driver class" when the url is missing,
  # which stops the application from starting instead of "skip when there is no DataSource".
  # External configuration puts them back with exclude: [] together with trader.storage.enabled=true.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jackson:
    time-zone: UTC

server:
  # Port and bind address are decided by external configuration; these are the production defaults, overridden for
  # local dev in config/application.yml. The loopback bind address is what LocalRequestGuardFilter relies on.
  port: 8093
  address: 127.0.0.1
  shutdown: graceful

trader:
  # trader.environment has no default and must be declared by external configuration (DEV | PROD); see EnvironmentGuard
  storage:
    enabled: false
    pgpass:
      # When spring.datasource.password is empty, take the password from ~/.pgpass (the same file psql uses)
      enabled: true
  # Both brokers are disabled by default; host/port/client-id are sensitive and only appear in secrets.yml / trader.env.
  # Everything else here is a connection-layer mechanism parameter (environment-independent).
  ibkr:
    enabled: false
    auto-connect: true
    primary-exchange: NASDAQ
    connect-timeout: 10s
    request-timeout: 15s
    heartbeat-interval: 30s
    heartbeat-timeout: 10s
    message-rate-per-second: 40
    reconnect:
      initial-delay: 5s
      max-delay: 60s
      max-attempts: -1
  futu:
    enabled: false
    auto-connect: true
    client-info: trading-signal
    encrypt: false
    connect-timeout: 10s
    reply-timeout: 10s
    health-interval: 30s
    reconnect:
      initial-delay: 5s
      max-delay: 60s
      max-attempts: -1
    limits:
      get-global-state: 60/30s
      get-acc-list: 10/30s
  # Market-data foundation (phase 2). Mechanism parameters live here; schedule-enabled is decided by external
  # configuration (release package true / dev machine false; a single scheduling instance)
  marketdata:
    schedule-enabled: false
    increment-cron: "0 30 17 * * MON-FRI"
    valuation-cron: "0 40 17 * * MON-FRI"     # valuation snapshot runs after the daily increment: market cap follows price, so only an after-close fetch represents the day
    financials-cron: "0 0 7 * * SAT"
    # Same-day catch-up check: later than the close, earlier than the next pre-market (after pre-market starts the
    # broker no longer serves snapshots for the previous day)
    catchup-cron: "0 0 21 * * MON-FRI"
    zone: America/New_York
    universe:
      cross-check-spy: true
      sync-cron: "0 30 6 * * SAT"
      static-batch-size: 200
      # Maximum removals allowed in one sync: max(absolute value, current members x percent). Above that the whole
      # index is skipped and the job is recorded PARTIAL; force is needed to let it through. SP500 threshold 25,
      # NDX100 threshold 5 (observed as of 2026-09-25: real removals per sync are 0~1)
      max-removals-per-sync: 5
      max-removals-percent: 5
      # Batch-level recovery: when more than this many symbols in one batch are confirmed "unknown to Futu", the
      # whole batch is left untouched and unmarked for a human to look at
      # (observed as of 2026-10-07: over a month in production with 500+ instruments, RESOLVED -> unknown happened once)
      max-unknown-per-batch: 3
    pool:
      max-size: 50
    refresh:
      batch-size: 90          # symbols subscribed per batch (<= subscription quota 100 - reserve)
      hold-seconds: 65        # a subscription must be held for 1 minute before it can be cancelled
      universe-increment: true
      full-count: 1000
      overlap: 5
      rehab-spread-days: 5    # once the full set of price-adjustment factors expires, each increment refreshes at most 1/5 (least recently refreshed first), so expiries do not pile up and lengthen one increment
    history:
      from: 2006-01-01
      quota-reserve: 10
    fundamentals:
      enabled: true
      snapshot-batch-size: 400        # broker limit; measured: 400 symbols round-trip in 228ms
      financial-periods: 12
      profile-refresh-after: 30d
      financial-stale-after: 180d
    adjust:
      factor-mode: PER_EVENT   # measured: Futu factors are per-event ratios and must be compounded (see FactorMode)
    # Real-time quotes (not persisted): auto-subscribe is decided by external configuration (dev machine false /
    # release package true; two instances subscribing at once use double the quota)
    realtime:
      enabled: true
      auto-subscribe: false
      reserve-quota: 10
      pause-during-refresh: true
      stream-interval: 1s
      unsubscribe-min-age: 61s
  # Account and positions (phase 3). key-secret (HMAC key for account numbers) and cash-equivalents (symbols of the
  # cash-management instruments) are sensitive and only go into config/secrets.yml / trader.env
  # (TRADER_ACCOUNT_KEY_SECRET, TRADER_ACCOUNT_CASH_EQUIVALENTS)
  account:
    enabled: true
    snapshot-cron: "0 0 18 * * MON-FRI"    # US/Eastern 18:00: after the 17:30 increment and 17:40 valuation; the 21:00 catch-up check is the fallback
    value-tolerance: 0.002                  # market-value reconciliation tolerance (ratio); more than 5x is FAIL
    identity-tolerance: 1                   # funds-identity tolerance (USD)
  # Holding risk panel (3.5.0, ARCHITECTURE §29): only checks the user's rules and reports numbers, no buy/sell
  # advice. Defaults are the values of the plan the user approved on 2026-10-30
  holding-review:
    window-days: 10            # earnings warning window (trading days)
    stress-multiple: 1.5       # stress scenario = historical maximum drop x this multiple
    # loss-budget-pct: 1       # at most this percent of net liquidation lost on one name through earnings; set by the user. Unset = no over-budget check and no position sizing
    sma-short: 50              # short moving average; the long average, slope lookback, ATR and chandelier reuse entry-signal sentinel-v1
    break-confirm-days: 3      # this many consecutive closes below the 200-day average count as a confirmed break
    death-cross: true          # 50-day average below the 200-day average is a review condition
    include-pool: true         # also include pool members not held (distribution and position sizing only)
  # Entry signals (phase 4). Criteria parameters are hard-coded with the criteria version; only switches and times
  # here. Scheduled evaluation is only wired on the schedule-enabled instance
  signal:
    enabled: true
    evaluation-cron: "0 10 18 * * MON-FRI"   # US/Eastern 18:10: after the increment, valuation and account snapshot (including the HOLDING sync)
    catchup-cron: "0 0 22 * * MON-FRI"       # offset from the 21:00 market-data catch-up: re-runs when the day has no evaluation, or had stale skips whose data is now complete
  # Quantitative selection (phase 6, ARCHITECTURE §25): a separate feature, unrelated to entry signals. Scoring
  # parameters are hard-coded with the model version; only the input backfill range is here.
  # Scheduled tasks are only wired on the schedule-enabled instance; the cron expressions must be written here
  # (ScheduledPlaceholdersTest)
  selection:
    enabled: true
    daily-cron: "0 30 18 * * MON-FRI"     # US/Eastern 18:30: after the 17:40 valuation snapshot and 18:10 signal evaluation
    catchup-cron: "0 30 22 * * MON-FRI"   # re-run when the day has no scores (offset from the 22:00 signal catch-up)
    weekly-cron: "0 0 9 * * SAT"          # Saturday 09:00: refresh announcement dates, fetch missing security types (after the 07:00 financials job)
    sim-weekly-cron: "0 0 10 * * SAT"     # Saturday 10:00: simulated-trading weekly report (after the weekly refresh)
    price-from: 2016-01-01        # first date of the IBKR daily-bar backfill (12-month momentum from a 2018 backtest needs 2017 onward)
    seam-months: 4                # how many months past the start of Futu daily bars to fetch, so there is an overlap to check
    financial-periods: 50         # number of quarterly periods (Futu's per-request limit is 50, measured to reach back to about 2014)
    valuation-range: YEAR10       # valuation history lookback (measured: from 2016-10)
    seam-min-compared: 60
    seam-tolerance: 0.001         # seam daily-return difference tolerance 0.1%
    seam-min-share: 0.95

  ai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5.6-sol
    timeout: 120s                 # per call
    max-retries: 2
    signal-veto-enabled: false    # call the model for vetoes during signal evaluation: only enabled in production external config (dev and prod both enabled would bill twice)
    daily-call-limit: 20          # maximum calls per (US/Eastern) day, manual calls included
    job-budget: 15m               # total time budget for the AI part of one evaluation job; candidates beyond it pass without a conclusion
    reasoning-effort: medium
    max-output-tokens: 16000      # reasoning tokens count too; too small a value truncates

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      status:
        # Gateway temporarily unreachable -> DEGRADED, HTTP 200; ordered between OUT_OF_SERVICE and UP
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200
  info:
    build:
      enabled: true

logging:
  level:
    root: INFO
    org.jdkxx.trader: INFO
