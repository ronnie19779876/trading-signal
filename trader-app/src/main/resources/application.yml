# jar 内只放与环境无关的默认值。运行配置一律外置：
#   本机开发  config/application.yml（入库，无密码）+ config/secrets.yml（gitignore）
#   生产      deploy/config/application.yml + deploy/config/trader.env（gitignore）
# 启动参数 --spring.config.additional-location=file:./config/
spring:
  application:
    name: trading-signal
  # 默认排除数据源与 Flyway 自动配置：只要 classpath 上有 Hikari，缺 url 时 DataSourceAutoConfiguration
  # 会报 "Failed to determine a suitable driver class" 让应用起不来，而不是"没有 DataSource 就跳过"。
  # 外置配置里 trader.storage.enabled=true 的同时用 exclude: [] 放回来。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jackson:
    time-zone: UTC

server:
  # 端口与监听地址由外置配置决定；这里给的是生产默认值，本机开发在 config/application.yml 覆盖
  port: 8093
  address: 127.0.0.1
  shutdown: graceful

trader:
  # trader.environment 没有默认值，必须由外置配置声明（DEV | PROD），见 EnvironmentGuard
  storage:
    enabled: false
    pgpass:
      # spring.datasource.password 为空时从 ~/.pgpass 取密码（与 psql 共用同一份）
      enabled: true
  # 两家券商默认不启用；host/port/client-id 属于敏感配置，只在 secrets.yml / trader.env 里出现。
  # 其余为连接层的机制参数（与环境无关）。
  ibkr:
    enabled: false
    auto-connect: true
    primary-exchange: NASDAQ
    connect-timeout: 10s
    request-timeout: 15s
    heartbeat-interval: 30s
    heartbeat-timeout: 10s
    message-rate-per-second: 40
    reconnect:
      initial-delay: 5s
      max-delay: 60s
      max-attempts: -1
  futu:
    enabled: false
    auto-connect: true
    client-info: trading-signal
    encrypt: false
    connect-timeout: 10s
    reply-timeout: 10s
    health-interval: 30s
    reconnect:
      initial-delay: 5s
      max-delay: 60s
      max-attempts: -1
    limits:
      get-global-state: 60/30s
      get-acc-list: 10/30s
  # 行情数据底座（第 2 期）。机制参数在这里；schedule-enabled 由外置配置决定（发布包 true / 开发机 false，单实例）
  marketdata:
    schedule-enabled: false
    increment-cron: "0 30 17 * * MON-FRI"
    valuation-cron: "0 40 17 * * MON-FRI"     # 估值快照排在每日增量之后：市值随价格走，收盘后取才代表当日
    financials-cron: "0 0 7 * * SAT"
    # 当天补偿检查：晚于收盘、早于次日盘前（券商过了盘前就不再给当日口径的快照）
    catchup-cron: "0 0 21 * * MON-FRI"
    zone: America/New_York
    universe:
      cross-check-spy: true
      sync-cron: "0 30 6 * * SAT"
      static-batch-size: 200
    pool:
      max-size: 50
    refresh:
      batch-size: 90          # 每批订阅只数（≤ 订阅额度 100 − 预留）
      hold-seconds: 65        # 订阅满 1 分钟才能反订阅
      universe-increment: true
      full-count: 1000
      overlap: 5
      rehab-spread-days: 5    # 全量复权因子到期后每次增量最多刷 1/5（最久未刷优先），免得集中到期拖长增量
    history:
      from: 2006-01-01
      quota-reserve: 10
    fundamentals:
      enabled: true
      snapshot-batch-size: 400        # 券商上限；实测 400 只往返 228ms
      financial-periods: 12
      profile-refresh-after: 30d
      financial-stale-after: 180d
    adjust:
      factor-mode: PER_EVENT   # 实测：富途因子是逐事件比例，需复合（见 FactorMode）
    # 实时报价（不落库）：auto-subscribe 由外置配置决定（开发机 false / 发布包 true，两个实例同时订会占双份额度）
    realtime:
      enabled: true
      auto-subscribe: false
      reserve-quota: 10
      pause-during-refresh: true
      stream-interval: 1s
      unsubscribe-min-age: 61s
  # 账户与持仓（第 3 期）。key-secret（账户号 HMAC 密钥）与 cash-equivalents（现金管理工具代码）属于敏感配置，
  # 只放 config/secrets.yml / trader.env（TRADER_ACCOUNT_KEY_SECRET、TRADER_ACCOUNT_CASH_EQUIVALENTS）
  account:
    enabled: true
    snapshot-cron: "0 0 18 * * MON-FRI"    # 美东 18:00：排在增量 17:30、估值 17:40 之后；21:00 补偿检查兜底
    value-tolerance: 0.002                  # 市值对账容差（比例），超过 5 倍记 FAIL
    identity-tolerance: 1                   # 资金恒等式容差（美元）
  # 入场信号（第 4 期）。判据参数跟着判据版本写死在代码里，这里只有开关与时点；定时评估只在 schedule-enabled 的实例装配
  signal:
    enabled: true
    evaluation-cron: "0 10 18 * * MON-FRI"   # 美东 18:10：排在增量、估值、账户快照（含持仓同步 HOLDING）之后
    catchup-cron: "0 0 22 * * MON-FRI"       # 与 21:00 行情补偿错开：当天缺评估或有过期跳过但现已补齐的就重跑

  ai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5.6-sol
    timeout: 120s
    max-retries: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      status:
        # 网关暂时不可达 → DEGRADED，HTTP 200；排在 OUT_OF_SERVICE 与 UP 之间
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200
  info:
    build:
      enabled: true

logging:
  level:
    root: INFO
    org.jdkxx.trader: INFO
