# External configuration template for the production instance. Shipped with the release package to
# <deploy dir>/config/application.yml; it is replaced on every upgrade (new cron settings live here).
# Secret values (database password, gateway host/port/client-id, OpenAI key) come from trader.env in the same
# directory (never committed), which bin/trader.sh sources into environment variables before starting;
# Spring's relaxed binding maps them automatically (TRADER_IBKR_HOST -> trader.ibkr.host). Environment
# variables take precedence over this file, so TRADER_IBKR_ENABLED=true overrides the enabled: false below.
server:
  port: 8093
  # Listen on loopback only; outside access goes through an SSH tunnel. The REST API has no authentication
  # and /actuator/shutdown is exposed, so this must never bind to other interfaces.
  address: 127.0.0.1

spring:
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:postgresql://${TRADER_DB_HOST:127.0.0.1}:${TRADER_DB_PORT:5432}/db_trader
    username: trader
    # When empty, the password comes from the service user's ~/.pgpass
    password: ${TRADER_DB_PASSWORD:}

trader:
  environment: PROD
  storage:
    enabled: true
  marketdata:
    # Production instance: scheduled batch jobs + subscribe to real-time quotes for the pool and holdings at
    # startup (only one instance per server may enable these two; the quote subscription quota is per account)
    schedule-enabled: true
    realtime:
      auto-subscribe: true
  ibkr:
    enabled: false
  futu:
    enabled: false
  ai:
    # Model veto during signal evaluation (phase 4): enabled on the production instance only. The key
    # OPENAI_API_KEY is in trader.env; without a key, signals are still produced, each candidate records one
    # SKIPPED_BUDGET row (not configured), and the signal audit reports it
    signal-veto-enabled: true

management:
  endpoints:
    web:
      exposure:
        # shutdown is the stop channel used by bin/trader.sh stop; safe only because server.address binds
        # to loopback
        include: health,info,shutdown
  endpoint:
    shutdown:
      enabled: true

logging:
  level:
    org.jdkxx.trader: INFO
