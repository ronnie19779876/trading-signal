# External configuration for local development. Committed, so it contains no password, host or gateway port.
# Start: ./scripts/run-local.sh      Stop: ./scripts/run-local.sh stop      IDEA: .run/TraderApplication (local).run.xml
server:
  # Port allocation: this project uses 8083 for dev / 8093 for production / 5174 for Vite. On this machine
  # 8081/8082/8090/8091/5173 are already taken by other projects or tunnels.
  # Must stay the first port: key in this file (run-local.sh greps for it).
  port: 8083
  # Listen on loopback only. The REST API has no authentication and /actuator/shutdown is open; binding to
  # all interfaces would hand them to the whole local network
  address: 127.0.0.1

spring:
  # Bring back the DataSource and Flyway auto-configuration that the jar's built-in config excludes
  # (required together with trader.storage.enabled=true)
  autoconfigure:
    exclude: []
  datasource:
    # WARNING: this is db_trader_dev, not db_trader. The two differ only by a suffix; a typo would connect to
    #    the production database -- but the application would refuse to start: EnvironmentGuard compares
    #    the app_environment marker stored in the database
    url: jdbc:postgresql://${TRADER_DB_HOST:127.0.0.1}:${TRADER_DB_PORT:5432}/db_trader_dev
    username: trader
    # Three password sources, by priority: environment variable TRADER_DB_PASSWORD -> config/secrets.yml ->
    # ~/.pgpass (shared with psql; read by PgpassEnvironmentPostProcessor when this resolves to empty)
    password: ${TRADER_DB_PASSWORD:}
  config:
    # Secrets: database password, host/port/client-id of both gateways, OpenAI key. The file is gitignored;
    # copy it from secrets.yml.example
    import: optional:file:./config/secrets.yml

trader:
  # Required. Compared with the app_environment marker in the database; startup is refused on a mismatch
  environment: DEV
  storage:
    enabled: true
  marketdata:
    # No scheduled batch jobs on a dev machine, and no automatic real-time quote subscription (reconcile by
    # hand with POST /api/quotes/subscriptions/reconcile), so the dev instance does not eat into the
    # subscription quota the production instance shares on the same account
    schedule-enabled: false
    realtime:
      auto-subscribe: false
  # Both gateways are disabled by default so that a fresh clone without secrets.yml can still start.
  # To connect to the gateways locally, set enabled: true in config/secrets.yml and fill in
  # host/port/client-id (see secrets.yml.example).
  ibkr:
    enabled: false
  futu:
    enabled: false
    client-info: trading-signal-dev

management:
  endpoints:
    web:
      exposure:
        # shutdown is the stop channel of scripts/run-local.sh stop (Spring Boot's own graceful shutdown, no
        # signals). The endpoint has no authentication; exposing it is safe only because of
        # server.address: 127.0.0.1 above
        include: health,info,shutdown
  endpoint:
    shutdown:
      enabled: true

logging:
  level:
    org.jdkxx.trader: DEBUG
